<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣縣市大富翁 Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'monopoly-bg': '#1a1c2e',
              'monopoly-board': '#e2e8f0',
              'monopoly-center': '#2d3748',
            },
            backgroundImage: {
               'wood-pattern': "url('https://www.transparenttextures.com/patterns/wood-pattern.png')",
               'felt-pattern': "url('https://www.transparenttextures.com/patterns/black-felt.png')",
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #0f172a;
        color: #e2e8f0;
        overflow: hidden;
      }
      
      /* 3D Dice Animation */
      @keyframes roll3d {
        0% { transform: rotateX(0deg) rotateY(0deg); }
        25% { transform: rotateX(180deg) rotateY(90deg); }
        50% { transform: rotateX(360deg) rotateY(180deg); }
        75% { transform: rotateX(540deg) rotateY(270deg); }
        100% { transform: rotateX(720deg) rotateY(360deg); }
      }
      .animate-roll {
        animation: roll3d 0.6s ease-out;
      }

      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
